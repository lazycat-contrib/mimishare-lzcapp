application:
  subdomain: mimishare
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://mimishare:80/
services:
  mimishare:
    # upstream: catwsq/mimishare:latest@sha256:a0908d0cb6ca831c5a260034b0c1a2836d3581a3dfb96880cf00a0f4c943b1cd
    image: registry.lazycat.cloud/czyt/catwsq/mimishare:2dbb6a4d2aa01dc4
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/share:/app/share
      - /lzcapp/var/wallpaper:/app/wallpaper
      - /lzcapp/var/config:/app/config
