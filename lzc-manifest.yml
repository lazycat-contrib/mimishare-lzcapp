application:
  subdomain: mimishare
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://mimishare:80/

services:
  mimishare:
    # upstream: catwsq/mimishare:latest
    image: catwsq/mimishare:latest
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/share:/app/share
      - /lzcapp/var/wallpaper:/app/wallpaper
      - /lzcapp/var/config:/app/config
