name: mimishare
package: community.lazycat.app.mimishare
version: 0.0.1
min_os_version: 1.3.8
description: 卡片式文件分享应用
homepage: https://hub.docker.com/r/catwsq/mimishare
author: catwsq
application:
  subdomain: mimishare
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://mimishare:80/

services:
  mimishare:
    container_name: mimishare
    #  catwsq/mimishare
    image: registry.lazycat.cloud/czyt/catwsq/mimishare:7e58e752b814c9cc
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/share:/app/share
      - /lzcapp/var/wallpaper:/app/wallpaper
      - /lzcapp/var/config:/app/config

locales:
  zh:
    name: "mimishare"
    description: "卡片式文件分享应用"
  en:
    name: "mimishare"
    description: "a card-based file sharing application"
